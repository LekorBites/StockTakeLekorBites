function chk(){if(U===undefined)return;if(!U){ss&&ss();ss=null;if(S.unsub)S.unsub();S.me=null;S.sid='';S.sess=null;S.sids=[];return login()}
if(S.me&&S.me.uid==U.uid)return;
if(U.providerData.some(p=>p.providerId=='google.com')){S.me={role:'M',name:U.displayName||'Pengurus',uid:U.uid};S.tab='sesi'}
else{const w=S.workers.find(x=>x.uid==U.uid);if(!w)return;S.me={role:'W',id:w.id,name:w.name,uid:U.uid};S.tab='mine'}
shell();startSess()}
const out=()=>au.signOut();
function sesOpts(){const e=$('#ses');if(e)e.innerHTML=S.sids.map(s=>`<option ${s==S.sid?'selected':''}>${s}</option>`).join('')}
function login(){$('#app').innerHTML=`<div class=card><h2>📦 Stock Take Lekor Bites</h2><button onclick=gLogin()>Masuk Pengurus (Google)</button><hr style="width:100%"><select id=who>${S.workers.map(w=>`<option value=${w.id}>${E(w.name)}</option>`).join('')}</select><input id=pin type=password placeholder=Password><button onclick=wLogin()>Masuk Pekerja</button><p id=err></p></div>`}
async function gLogin(){try{await au.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){$('#err').textContent=e.message}}
async function wLogin(){const w=S.workers.find(x=>x.id==$('#who').value);if(!w)return;try{await au.signInWithEmailAndPassword(w.email,$('#pin').value)}catch(e){$('#err').textContent='Password salah'}}
function shell(){const m=S.me.role=='M';$('#app').innerHTML=`<header><b>${E(S.me.name)}</b><span><select id=ses onchange="pick(this.value)"></select> <button onclick="out()">Keluar</button></span></header>${m?`<nav>${[['sesi','Sesi'],['pkj','Pekerja'],['asg','Assign'],['sem','Semak'],['exp','Export']].map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="tab('${t[0]}')">${t[1]}</button>`).join('')}</nav>`:''}<div id=tools></div><div id=body></div>`;sesOpts();tools();body(1)}
function tab(t){S.tab=t;S.q='';shell()}
function pick(id){if(S.unsub)S.unsub();S.sid=id;S.sess=null;S.sel.clear();if(id)S.unsub=db.doc('sessions/'+id).onSnapshot(d=>{S.sess=d.data()||null;body()});sesOpts();body(1)}
function tools(){const t=S.tab,g=`<select onchange="S.g=this.value===''?'':+this.value;body(1)"><option value="">Semua kumpulan</option>${DATA.groups.map((x,i)=>`<option value=${i} ${S.g===i?'selected':''}>${E(x)}</option>`).join('')}</select>`,
q=`<input placeholder="Cari produk..." value="${E(S.q)}" oninput="S.q=this.value;body(1)">`,wo=`<option value="">Semua pekerja</option>`+S.workers.map(w=>`<option value=${w.id} ${S.wf==w.id?'selected':''}>${E(w.name)}</option>`).join('');let h='';
if(t=='mine')h=q+`<label><input type=checkbox ${S.todo?'checked':''} onchange="S.todo=this.checked;body(1)"> Belum diisi sahaja</label>`;
if(t=='asg')h=q+g+`<label><input type=checkbox ${S.un?'checked':''} onchange="S.un=this.checked;body(1)"> Belum assign</label><select id=aw>${S.workers.map(w=>`<option value=${w.id}>${E(w.name)}</option>`).join('')}</select><button onclick=selAll()>Pilih semua paparan</button><button onclick="S.sel.clear();body(1)">Kosongkan</button><button onclick=doAssign(1)>Assign</button><button onclick=doAssign(0)>Buang assign</button>`;
if(t=='sem')h=q+g+`<select onchange="S.wf=this.value;body(1)">${wo}</select>`;$('#tools').innerHTML=h}
function flt(L){const q=S.q.toLowerCase();return L.filter(i=>(!q||i[1].toLowerCase().includes(q))&&(S.g===''||i[2]===S.g))}
function body(f){const a=document.activeElement;if(!f&&a&&a.closest('#body')&&/INPUT|TEXTAREA/.test(a.tagName)&&a.type!='checkbox')return;const b=$('#body');if(!b||!S.me)return;
const t=S.tab,need=['mine','asg','sem','exp'].includes(t);b.innerHTML=t=='sesi'?vSesi():t=='pkj'?vPkj():need&&!S.sess?NOS:t=='mine'?vMine():t=='asg'?vAsg():t=='sem'?vSem():vExp()}
function row(i,lock,wk){const c=C()[K(i[0])]||{};return `<div class=it><div class=n>${E(i[1])}<small> #${i[0]}${wk?' · '+E(W(A()[K(i[0])])):''}</small></div><div class=f><input class=q type=number inputmode=decimal min=0 step=any placeholder=Kuantiti value="${c.q??''}" ${lock?'disabled':''} onchange="save(${i[0]},'q',this.value)"><input class=r placeholder="Remarks (pilihan)" value="${E(c.m||'')}" ${lock?'disabled':''} onchange="save(${i[0]},'m',this.value)"></div></div>`}
async function save(r,f,v){if(S.me.role=='W'&&D()[S.me.id])return alert('Sudah dikunci');const p='counts.'+K(r)+'.';
try{await db.doc('sessions/'+S.sid).update({[p+f]:f=='q'?(v===''?FV.delete():+v):v,[p+'by']:S.me.name})}catch(e){alert('Gagal simpan: '+e.message)}}
const mineList=w=>DATA.items.filter(i=>A()[K(i[0])]==w);
function vMine(){const my=mineList(S.me.id),dn=D()[S.me.id],fl=my.filter(i=>hasQ(i[0])).length;let L=flt(my);if(S.todo)L=L.filter(i=>!hasQ(i[0]));
return `<div class="bar ${dn?'ok':''}"><span>${dn?'✔ Siap & dikunci':'✏️ Sedang kira (boleh edit)'}</span><b>${fl}/${my.length}</b></div>`+(my.length?'':'<p class=m>Belum ada item di-assign kepada anda.</p>')+L.map(i=>row(i,dn)).join('')+(dn||!my.length?'':`<button class=big onclick=complete()>Siap &amp; Kunci</button>`)}
async function complete(){const my=mineList(S.me.id),n=my.filter(i=>!hasQ(i[0])).length;if(n)return alert(n+' item belum diisi. Isi 0 jika tiada stok.');
if(!confirm('Selepas ini tidak boleh ubah lagi. Teruskan?'))return;await db.doc('sessions/'+S.sid).update({['done.'+S.me.id]:true})}
function vSesi(){return `<div class=it><input type=month id=nm><button onclick=newS()>Buka stock take bulan ini</button></div><p class=m>Sesi sedia ada: ${S.sids.join(', ')||'tiada'}</p>`}
async function newS(){const v=$('#nm').value;if(!v)return;const r=db.doc('sessions/'+v);if(!(await r.get()).exists)await r.set({month:v,assign:{},counts:{},done:{}});pick(v)}
function vPkj(){return `<div class=it><input id=wn placeholder="Nama pekerja"><input id=wp type=text placeholder="Password (min 6)" style="width:150px"><button onclick=addW()>Tambah</button></div>`+S.workers.map(w=>`<div class=it><div class=n style="flex:1">${E(w.name)}</div><button onclick="newPw('${w.id}')">Tukar password</button><button onclick="delW('${w.id}')">Padam</button></div>`).join('')}
const em=(id,n)=>'w'+id.toLowerCase()+n+'@lekorbites.app';
async function mkAuth(id,n,pw){let s;try{s=firebase.app('sec')}catch(e){s=firebase.initializeApp(firebaseConfig,'sec')}const c=await s.auth().createUserWithEmailAndPassword(em(id,n),pw);await s.auth().signOut();return c.user.uid}
async function addW(){const n=$('#wn').value.trim(),p=$('#wp').value;if(!n||p.length<6)return alert('Isi nama & password (min 6 aksara)');const r=db.collection('workers').doc();
try{const u=await mkAuth(r.id,1,p),b=db.batch();b.set(r,{name:n,n:1,email:em(r.id,1),uid:u});b.set(db.doc('uids/'+u),{wid:r.id});await b.commit()}catch(e){alert(e.message)}}
async function newPw(id){const w=S.workers.find(x=>x.id==id),p=prompt('Password baru untuk '+w.name+' (min 6 aksara)');if(!p||p.length<6)return;
try{const n=(w.n||1)+1,u=await mkAuth(id,n,p),b=db.batch();b.update(db.doc('workers/'+id),{n,email:em(id,n),uid:u});b.set(db.doc('uids/'+u),{wid:id});b.delete(db.doc('uids/'+w.uid));await b.commit();alert('Password dikemas kini')}catch(e){alert(e.message)}}
async function delW(id){const w=S.workers.find(x=>x.id==id);if(!confirm('Padam pekerja ini?'))return;const b=db.batch();b.delete(db.doc('workers/'+id));b.delete(db.doc('uids/'+w.uid));await b.commit()}
function vAsg(){let L=flt(DATA.items.filter(i=>i[3]));if(S.un)L=L.filter(i=>!A()[K(i[0])]);S.vis=L;
return `<div class=bar><span>${L.length} item dipaparkan</span><b>${S.sel.size} dipilih</b></div>`+L.slice(0,300).map(i=>`<label class=it><input type=checkbox ${S.sel.has(i[0])?'checked':''} onchange="tg(${i[0]},this.checked)"><div class=n>${E(i[1])}<small> #${i[0]}</small></div><b class=tag>${A()[K(i[0])]?E(W(A()[K(i[0])])):'—'}</b></label>`).join('')+(L.length>300?`<p class=m>Dipaparkan 300 pertama. "Pilih semua paparan" tetap pilih kesemua ${L.length}.</p>`:'')}
function tg(r,c){c?S.sel.add(r):S.sel.delete(r);body(1)}
function selAll(){S.vis.forEach(i=>S.sel.add(i[0]));body(1)}
async function doAssign(on){const w=$('#aw').value;if(!S.sel.size||(on&&!w))return alert('Pilih item (dan pekerja) dulu');const u={};S.sel.forEach(r=>u['assign.'+K(r)]=on?w:FV.delete());await db.doc('sessions/'+S.sid).update(u);S.sel.clear()}
async function unlock(w){if(confirm('Buka kunci '+W(w)+'?'))await db.doc('sessions/'+S.sid).update({['done.'+w]:FV.delete()})}
function vSem(){let h=S.workers.map(w=>{const a=mineList(w.id),f=a.filter(i=>hasQ(i[0])).length;return `<div class="bar ${D()[w.id]?'ok':''}" onclick="S.wf='${w.id}';tools();body(1)"><b>${E(w.name)}</b><span>${f}/${a.length}</span>${D()[w.id]?`✔ Siap <button onclick="event.stopPropagation();unlock('${w.id}')">Buka kunci</button>`:'sedang kira'}</div>`}).join('');
let L=flt(DATA.items.filter(i=>S.wf?A()[K(i[0])]==S.wf:A()[K(i[0])]));return h+L.slice(0,300).map(i=>row(i,false,1)).join('')+(L.length>300?'<p class=m>Tapis untuk lihat selebihnya.</p>':'')}
function vExp(){const o=[];for(let r=3;r<=DATA.last;r++)o.push(CNT.has(r)&&hasQ(r)?C()[K(r)].q:'');S.tsv=o.join('\n');const as=DATA.items.filter(i=>A()[K(i[0])]),miss=as.filter(i=>!hasQ(i[0])).length,nd=S.workers.filter(w=>mineList(w.id).length&&!D()[w.id]).map(w=>E(w.name));
return `<div class=bar>${miss?'⚠ '+miss+' item assign belum diisi. ':'✔ Semua item assign sudah diisi. '}${nd.length?'Belum siap: '+nd.join(', '):''}</div><p class=m>Salin → tampal di sel <b>D3</b> (kolum D, baris 3–${DATA.last}, susunan sama seperti stok anda). Baris yang tidak dikira kekal kosong, jadi baris formula/ringkasan di D akan ditimpa dengan kosong. Tampal hanya pada julat yang anda mahu.</p><button onclick=cp() style="margin:0 10px">Salin Kolum D</button> <button onclick=csv()>CSV (butiran + remarks)</button><textarea readonly rows=8>${E(S.tsv)}</textarea>`}
async function cp(){await navigator.clipboard.writeText(S.tsv);alert('Disalin!')}
function csv(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',L=['Row,Produk,Pekerja,Kuantiti,Remarks,Kemaskini oleh'];DATA.items.filter(i=>A()[K(i[0])]||hasQ(i[0])).forEach(i=>{const c=C()[K(i[0])]||{};L.push([i[0],q(i[1]),q(W(A()[K(i[0])])),c.q??'',q(c.m),q(c.by)].join(','))});
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+L.join('\n')],{type:'text/csv'}));a.download='stock-take-'+S.sid+'.csv';a.click()}
</script></body></html>
